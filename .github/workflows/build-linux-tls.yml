name: build-linux-tls

on:
  push:
    branches: [tls-unify]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: System deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libssl-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf \
            pkg-config libsoup-3.0-dev javascriptcoregtk-4.1 libjavascriptcoregtk-4.1-dev \
            libnm-dev xdg-utils

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: dtolnay/rust-toolchain@stable

      - name: Frontend build
        run: |
          npm ci || npm install
          npm run build

      - name: Cargo build (release)
        run: cd src-tauri && cargo build --release

      - name: Show binary
        run: ls -lh src-tauri/target/release/antigravity-tools && file src-tauri/target/release/antigravity-tools

      - uses: actions/upload-artifact@v4
        with:
          name: antigravity-tools-linux-x86_64
          path: src-tauri/target/release/antigravity-tools
          if-no-files-found: error

      - name: Publish binary to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-tls-unify
          name: TLS unify build (Chrome132)
          body: |
            Antigravity TLS 指纹统一 + Chrome132 对齐
            二进制：antigravity-tools (linux x86_64)
          files: src-tauri/target/release/antigravity-tools
